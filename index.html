<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganga Kumari - Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f12;color:#fff;overflow-x:hidden}
nav{display:flex;justify-content:space-between;padding:20px 8%;position:fixed;width:100%;background:rgba(15,15,18,0.8);backdrop-filter:blur(10px);z-index:10}
nav .logo{font-weight:700;font-size:22px}
nav .logo span{color:#a855f7}
nav a{color:#aaa;text-decoration:none;margin-left:25px}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8%;background:radial-gradient(circle at 50% 50%, #2a1a4a 0%, #0f0f12 60%)}
.hero h1{font-size:50px;line-height:1.1}
.hero h1 span{background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#aaa;margin:20px 0 30px;max-width:600px;margin-left:auto;margin-right:auto}
.btn{display:inline-block;padding:12px 28px;border-radius:30px;text-decoration:none;font-weight:600;margin:5px}
.btn-primary{background:#fff;color:#000}
.btn-outline{border:1px solid #333;color:#fff}
section{padding:80px 8%}
h2{font-size:32px;margin-bottom:30px}
h2 span{color:#a855f7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#1a1a1f;border:1px solid #222;padding:25px;border-radius:16px}
.card:hover{border-color:#a855f7}
.skill-bar{background:#222;height:8px;border-radius:10px;margin-top:10px;overflow:hidden}
.skill-fill
